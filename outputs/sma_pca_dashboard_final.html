<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMA PCA Projection Suite</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f4f6fa;
        }
    /* ── Navbar ── */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: #0f172a;
            padding: 0 24px;
            height: 56px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,.4);
        }
        .navbar .brand {
            color: #f8fafc;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: .3px;
        }
        .navbar .brand span { color: #38bdf8; }
        .btn-group { display: flex; gap: 8px; }
        .nav-btn {
            background: #1e40af;
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 600;
            transition: background .15s;
        }
        .nav-btn:hover { background: #2563eb; }

        /* ── Content stream ── */
        .content-stream {
            margin-top: 56px;
            padding: 8px 8px;
            max-width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        /* ── Graph cards ── */
        .graph-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 8px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,.06);
            display: flex;
            flex-direction: column;
        }
        /* Make plotly divs fill the card */
        .graph-card > div { flex: 1; min-height: 0; width: 100% !important; }
        .graph-card .plotly-graph-div,
        .graph-card .js-plotly-plot,
        .graph-card .plot-container,
        .graph-card .plot-container svg { 
            width: 100% !important; 
            height: 100% !important; 
        }

        .graph-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 6px;
        }
    </style>
    <script>
        function scrollToGraph(id) {
            const el = document.getElementById(id);
            const navHeight = document.querySelector('.navbar').offsetHeight;
            const top = el.getBoundingClientRect().top + window.scrollY - navHeight - 8;
            window.scrollTo({ top: top, behavior: 'smooth' });
        }
    </script>
</head>
<body>
<nav class="navbar">
    <div class="brand"><span>SMA</span> Projection Suite</div>
    <div class="btn-group">
        <button class="nav-btn" onclick="scrollToGraph('g1')">A · Clean PCA</button>
        <button class="nav-btn" onclick="scrollToGraph('g2')">B · Imputed PCA</button>
        <button class="nav-btn" onclick="scrollToGraph('g3')">C · Scree</button>
        <button class="nav-btn" onclick="scrollToGraph('g4')">D · Biplot_C</button>
        <button class="nav-btn" onclick="scrollToGraph('g5')">E · Biplot</button>
        <button class="nav-btn" onclick="scrollToGraph('g6')">F · Sensitivity</button>
    </div>
</nav>
